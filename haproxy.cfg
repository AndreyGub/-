global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5000
    timeout client 50000
    timeout server 50000

# Веб-интерфейс статистики (опционально, для мониторинга)
listen stats
    bind *:8888
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:password  # логин и пароль для доступа

# Балансировка на 4 уровне (TCP) - Round Robin
listen web_tcp_balance
    bind *:80
    mode tcp
    balance roundrobin
    option tcp-check
    server python1 127.0.0.1:8888 check
    server python2 127.0.0.1:9999 check